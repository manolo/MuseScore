# Every component below is either an open pull request or a branch holding a
# feature the fork needs and upstream will not take. Nothing is committed onto
# a line by hand: the next rebuild would throw it away without saying so.
# See CONVENTIONS.md.
#
# Integration line: 4.7
#
# The maintained 4.7 line. Unlike 5.0, most of its content does not exist
# as an upstream pull request: these are ports retro-adapted to the older API,
# and several will never go upstream at all.
#
# That content lives on its own branch, fork/4.7-ports, and enters here as a
# single component. Keeping it as a branch rather than a pile of patches means
# a conflict is fixed once, in one place, instead of on every rebuild.
#
# The repository at this line uses the OLD monolithic layout: no muse or
# muse_deps submodules. The framework section is therefore absent on purpose.

line: 4.7
base: origin/4.7

# The brands stamped onto this line. Each becomes a branch <line>-<brand>,
# sharing one integration commit, so two builds would differ in their name
# and in nothing else.
#
# One for now. fork/brand/musemore/ holds a brand that is deliberately not
# listed here, and says why.
brands:
  - plectrascore

# What the installer carries besides MuseScore itself. Each of these is taken
# from where it is published, never from a working copy, and the version that
# actually went in is recorded in fork/CONTENTS.md so a build cannot lie about
# what it shipped.
#
#   kind: release  takes an asset from the latest release of repo
#   kind: raw      takes a file from a branch of repo
#
# dest is relative to the source tree. share/plugins and share/extensions are
# installed wholesale by share/CMakeLists.txt, so anything landing there needs
# no build change; share/sound and share/vst3 get their rules from the
# 20-install-rules fixup.
extras:
  - name: Plectro VST, free edition
    kind: release
    repo: manolo/vst-plectro
    license: MIT
    # One asset per platform. macOS and Windows unpack from a zip, Linux from
    # a tarball. There is no arm64 Linux build, so that AppImage ships without
    # the plugin and the README says so.
    assets:
      macos: 'Plectro-*-macOS-VST3.zip'
      windows: 'Plectro-*-Windows-x64-VST3.zip'
      linux_x86_64: 'Plectro-*-Linux-x86_64-VST3.tar.gz'
    dest: share/vst3

  - name: Lyrics and Chords Extractor
    kind: release
    repo: manolo/lyrics-extractor
    license: GPL-3.0-or-later
    # A .mext is a zip holding manifest.json and the files it names
    asset: 'lyrics-extractor.mext'
    unpack: yes
    dest: share/extensions/lyrics-extractor

  - name: Bandurria with tremolo
    kind: raw
    repo: manolo/sound-fonts
    ref: main
    license: CC0-1.0
    path: Bandurria-Con-Tremolo.sf2
    dest: share/sound/Bandurria-Con-Tremolo.sf2

  - name: Laud with tremolo
    kind: raw
    repo: manolo/sound-fonts
    ref: main
    license: CC0-1.0
    path: Laud-Con-Tremolo.sf2
    dest: share/sound/Laud-Con-Tremolo.sf2

  - name: Pulso y Pua
    kind: raw
    repo: manolo/sound-fonts
    ref: main
    license: CC0-1.0
    # The MuseScore 3 style single file plugin, not a 4.4 extension
    path: PulsoPua.qml
    dest: share/plugins/PulsoPua.qml


framework: none

components:
  - name: 4.7 ports and fork features
    ref: fork/4.7-ports
    local: true
    note: >
      Twenty-six commits as of 2026-10-08: the Encore importer adapted to 4.7,
      VST timing and keyswitches, several plugin API additions including the
      mixer, the tablature fret circle, the floating mixer panel sizing, and
      assorted fixes ported from the 4.6 patches. Rebased onto origin/4.7 when that moves,
      which is the one place a conflict has to be resolved.

api-notes:
  # Differences that bite when porting 5.0 work down to this line. Whenever a
  # port fails to build, look here before inventing a new adaptation.
  - symbol: Tuplet ownership
    on-5.0: setOwnershipParent(measure)
    on-4.7: setParent(measure)
    source: >
      Read it off the reader of each line, src/engraving/rw/read460/
      measureread.cpp, rather than guessing.

overlay:
  - .github/workflows/fork_builds.yml
