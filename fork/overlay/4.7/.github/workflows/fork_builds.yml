name: 'Fork: build 4.7'

# Builds the 4.7 integration line on the fork.
#
# Deliberately not the same file as the 5.0 one. The reusable workflows on the
# 4.7 line accept only build_mode, publish, sentry_project and build_number:
# framework_repo and framework_ref do not exist there, and passing them would
# fail the workflow at parse time. There is nothing to override anyway, since
# 4.7 still uses the old monolithic layout with no submodules at all.

on:
  push:
    # Every brand of this line, so a brand added to the manifest starts
    # building without anybody editing a workflow. The file lives in the
    # integration commit, which every brand shares, so it can name none of
    # them individually anyway.
    branches:
      - '4.7-*'
  workflow_dispatch:

jobs:

  build_mac:
    uses: ./.github/workflows/build_macos.yml
    with:
      build_mode: devel
      publish: 'off'
    secrets: inherit

  build_windows:
    uses: ./.github/workflows/build_windows.yml
    with:
      platforms: windows_x64
      build_mode: devel
      publish: 'off'
    secrets: inherit

  build_linux:
    uses: ./.github/workflows/build_linux.yml
    with:
      platforms: linux_x64 linux_arm64
      build_mode: devel
      publish: 'off'
    secrets: inherit

  package_mac_arm64_zip:
    needs: [build_mac]
    runs-on: macos-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Mac_*'
          merge-multiple: true
          path: ./raw/mac

      - name: Extract arm64 .app from DMG and zip
        run: |
          set -e
          DMG=$(find ./raw/mac -name "*.dmg" | head -1)
          echo "Using DMG: $DMG"

          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

          APP=$(find "$MOUNT_POINT" -name "*.app" -maxdepth 2 | head -1)
          echo "Found app: $APP"

          # Keep whatever the build called it. Naming it here would drop a
          # bundle called something else into somebody's Applications folder,
          # and this file cannot know the brand: it lives in the integration
          # commit, which every brand of the line shares.
          NAME=$(basename "$APP")
          ditto --arch arm64 "$APP" "$NAME"

          hdiutil detach "$MOUNT_POINT" -quiet

          codesign --force --deep --sign - "$NAME"

          zip -qr --symlinks 4.7-mac-arm64.zip "$NAME"

      - name: Upload arm64 zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 4.7-mac-arm64-zip
          path: 4.7-mac-arm64.zip

  package:
    needs: [build_mac, build_windows, build_linux, package_mac_arm64_zip]
    # Windows is skipped on push, and a skipped dependency would take this job
    # with it. Assembling what did build is the point.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # FIRST, before the downloads. checkout deletes the contents of the
      # workspace, so anything fetched before it is thrown away and the
      # package comes out empty while every step still reports success.
      #
      # It is here only for version.cmake: the brand's name is written there
      # by the branding commit, and this workflow sits in the integration
      # commit below it, so the name has to be read rather than known.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: false

      - name: Download macOS universal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Mac_*'
          merge-multiple: true
          path: ./raw/mac

      - name: Download macOS arm64 zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 4.7-mac-arm64-zip
          path: ./raw/mac-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Win_x64*'
          merge-multiple: true
          path: ./raw/win

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Lin_x64*'
          merge-multiple: true
          path: ./raw/linux

      - name: Assemble package
        id: assemble
        run: |
          set -e
          mkdir -p out
          DATE=$(date -u +"%Y-%m-%d")
          SHA=$(echo "${{ github.sha }}" | cut -c1-10)
          STAMP="${DATE}-${SHA}"

          APP=$(sed -n 's/^set(MUSE_APP_NAME_HUMAN_READABLE[[:space:]]*"\([^"]*\)").*/\1/p' version.cmake | head -1)
          [ -n "$APP" ] || { echo "cannot read the app name from version.cmake" >&2; exit 1; }
          echo "package=$APP-4.7" >> $GITHUB_OUTPUT

          copy_one() {
            local dir="$1" out="$2"; shift 2
            local f
            f=$(find "$dir" "$@" | head -1)
            if [ -n "$f" ]; then
              cp "$f" "out/$out"
              echo "  $out  <-  $f"
            else
              echo "  WARNING: nothing matched in $dir"; ls "$dir" || true
            fi
          }

          copy_one ./raw/mac       "$APP-4.7-${STAMP}-mac.dmg"           -name "*.dmg"
          copy_one ./raw/mac-arm64 "$APP-4.7-${STAMP}-mac-arm64.zip"     -name "*.zip"
          copy_one ./raw/win       "$APP-4.7-${STAMP}-win-x86_64.msi"    -name "*.msi"
          copy_one ./raw/linux     "$APP-4.7-${STAMP}-linux-x86_64.AppImage" -name "*.AppImage" ! -name "*.zsync"

          echo ""
          echo "Package contents:"
          ls -lh out/
          # An empty out/ makes upload-artifact warn and upload nothing, which
          # looks exactly like success. It is a failure.
          [ -n "$(ls -A out/)" ] || { echo "nothing was packaged" >&2; exit 1; }

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.assemble.outputs.package }}
          path: out/
          retention-days: 90
