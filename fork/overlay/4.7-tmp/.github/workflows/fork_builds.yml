name: 'Fork: build 4.7-tmp'

# Builds the 4.7 integration line on the fork.
#
# Deliberately not the same file as the 5.0 one. The reusable workflows on the
# 4.7 line accept only build_mode, publish, sentry_project and build_number:
# framework_repo and framework_ref do not exist there, and passing them would
# fail the workflow at parse time. There is nothing to override anyway, since
# 4.7 still uses the old monolithic layout with no submodules at all.

on:
  push:
    branches:
      - 4.7-tmp
  workflow_dispatch:

jobs:

  build_mac:
    uses: ./.github/workflows/build_macos.yml
    with:
      build_mode: devel
      publish: 'off'
    secrets: inherit

  # Windows only when dispatched by hand.
  #
  # On this line the portable job ignores the platforms input unless the event
  # is workflow_dispatch:
  #
  #   github.event_name != 'pull_request' &&
  #   (github.event_name != 'workflow_dispatch' || contains(inputs.platforms, 'windows_portable'))
  #
  # Under push the first branch of the or is already true, so windows_portable
  # runs whatever we ask for, and it dies signing: it uploads to s3://muse-sign,
  # a service a fork has no credentials for, and unlike the macOS signing it
  # does not check whether the secret is empty. The 5.0 line tests the input
  # itself and skips the job, which is why that workflow needs none of this.
  build_windows:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build_windows.yml
    with:
      platforms: windows_x64
      build_mode: devel
      publish: 'off'
    secrets: inherit

  build_linux:
    uses: ./.github/workflows/build_linux.yml
    with:
      platforms: linux_x64
      build_mode: devel
      publish: 'off'
    secrets: inherit

  package_mac_arm64_zip:
    needs: [build_mac]
    runs-on: macos-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Mac_*'
          merge-multiple: true
          path: ./raw/mac

      - name: Extract arm64 .app from DMG and zip
        run: |
          set -e
          DMG=$(find ./raw/mac -name "*.dmg" | head -1)
          echo "Using DMG: $DMG"

          MOUNT_POINT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet

          APP=$(find "$MOUNT_POINT" -name "*.app" -maxdepth 2 | head -1)
          echo "Found app: $APP"

          ditto --arch arm64 "$APP" MuseScore-4.7-tmp.app

          hdiutil detach "$MOUNT_POINT" -quiet

          codesign --force --deep --sign - MuseScore-4.7-tmp.app

          zip -r --symlinks MuseScore-4.7-tmp-mac-arm64.zip MuseScore-4.7-tmp.app

      - name: Upload arm64 zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 4.7-tmp-mac-arm64-zip
          path: MuseScore-4.7-tmp-mac-arm64.zip

  package:
    needs: [build_mac, build_windows, build_linux, package_mac_arm64_zip]
    # Windows is skipped on push, and a skipped dependency would take this job
    # with it. Assembling what did build is the point.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS universal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Mac_*'
          merge-multiple: true
          path: ./raw/mac

      - name: Download macOS arm64 zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: 4.7-tmp-mac-arm64-zip
          path: ./raw/mac-arm64

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Win_x64*'
          merge-multiple: true
          path: ./raw/win

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'MU4_*_Lin_x64*'
          merge-multiple: true
          path: ./raw/linux

      - name: Assemble package
        run: |
          set -e
          mkdir -p out
          DATE=$(date -u +"%Y-%m-%d")
          SHA=$(echo "${{ github.sha }}" | cut -c1-10)
          STAMP="${DATE}-${SHA}"

          copy_one() {
            local dir="$1" out="$2"; shift 2
            local f
            f=$(find "$dir" "$@" | head -1)
            if [ -n "$f" ]; then
              cp "$f" "out/$out"
              echo "  $out  <-  $f"
            else
              echo "  WARNING: nothing matched in $dir"; ls "$dir" || true
            fi
          }

          copy_one ./raw/mac       "MuseScore-4.7-tmp-${STAMP}-mac.dmg"           -name "*.dmg"
          copy_one ./raw/mac-arm64 "MuseScore-4.7-tmp-${STAMP}-mac-arm64.zip"     -name "*.zip"
          copy_one ./raw/win       "MuseScore-4.7-tmp-${STAMP}-win-x86_64.msi"    -name "*.msi"
          copy_one ./raw/linux     "MuseScore-4.7-tmp-${STAMP}-linux-x86_64.AppImage" -name "*.AppImage" ! -name "*.zsync"

          echo ""
          echo "Package contents:"
          ls -lh out/

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MuseScore-4.7-tmp
          path: out/
          retention-days: 90
